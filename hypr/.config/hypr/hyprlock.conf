background {
    monitor =
    color = rgba(0, 0, 0, 1.0) # Идеальный черный фон
}

input-field {
    monitor =
    # УВЕЛИЧЕНО: Было 250, 40
    size = 400, 60
    # УВЕЛИЧЕНО: Было 1
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 1.0)
    inner_color = rgba(0, 0, 0, 1.0)
    # УВЕЛИЧЕНО: Было стандартным
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = true
    placeholder_text = <span size="24pt"><i>Password...</i></span> # Текст внутри тоже крупнее
    hide_input = false
    # ПОДПРАВЛЕНО: Немного опустили ниже, чтобы не сливалось с часами
    position = 0, -80
    halign = center
    valign = center
}


# Строгие часы над полем ввода
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(150, 150, 150, 1.0)
    # УВЕЛИЧЕНО: Было 60
    font_size = 100
    font_family = Hack Nerd Font
    # ПОДПРАВЛЕНО: Немного выше, чтобы компенсировать размер
    position = 0, 120
    halign = center
    valign = center
}

# Индикатор раскладки клавиатуры
label {
    monitor =
    text = $LAYOUT
    color = rgba(100, 100, 100, 1.0) # Темно-серый, приглушенный цвет
    font_size = 20
    font_family = Hack Nerd Font
    position = 0, -160 # Располагаем ровно под полем ввода (которое у нас на -80)
    halign = center
    valign = center
}
